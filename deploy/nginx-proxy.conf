# /etc/nginx/snippets/aapadbandhu-proxy.conf — included by the aapadbandhu site only.
client_max_body_size 10m;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

# Android app for judges: https://sahaya.hmgenx.in/download/Sahaya-AI.apk
# The project dir is 711 (traverse only), so nginx reaches this folder and nothing else.
location /download/ {
    alias /srv/projects/aapadbandhu/shared/download/;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Content-Disposition attachment;
    autoindex off;
}

# Server-Sent Events: never buffered or compressed, held open for an hour.
location = /api/stream {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
}

location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append, so the app's rate limit sees the real client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;
}
