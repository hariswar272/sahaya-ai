# Sahaya AI — HTTP only, used until the certificates exist.
# One file per project on this box; this one never touches voxera / justwe / talk.
server {
    listen 80;
    listen [::]:80;
    server_name sahaya.hmgenx.in aapadbandhu.hmgenx.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include snippets/aapadbandhu-proxy.conf;
}
