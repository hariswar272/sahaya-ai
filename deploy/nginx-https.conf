# Sahaya AI (built as "Aapadbandhu AI") — https://sahaya.hmgenx.in.
# aapadbandhu.hmgenx.in keeps its own certificate and 301s here.
# One file per project on this box; this one never touches voxera / justwe / talk.
# No http2 on the listen lines: the :443 socket is shared with voxera (default_server),
# and turning it on here would change voxera too.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sahaya.hmgenx.in;

    ssl_certificate /etc/letsencrypt/live/sahaya.hmgenx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahaya.hmgenx.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/aapadbandhu-proxy.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aapadbandhu.hmgenx.in;

    ssl_certificate /etc/letsencrypt/live/aapadbandhu.hmgenx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aapadbandhu.hmgenx.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://sahaya.hmgenx.in$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sahaya.hmgenx.in aapadbandhu.hmgenx.in setu.hmgenx.in;

    # Certificate renewals answer here; the redirect lives in `location /` so it
    # cannot swallow the challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://sahaya.hmgenx.in$request_uri;
    }
}

# setu.hmgenx.in (Sahaya Setu) serves the same app with its own certificate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name setu.hmgenx.in;

    ssl_certificate /etc/letsencrypt/live/setu.hmgenx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/setu.hmgenx.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/aapadbandhu-proxy.conf;
}
