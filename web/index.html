    <script>
      // A new deploy activates its service worker immediately (autoUpdate); reload once so visitors never see a stale build.
      if ("serviceWorker" in navigator) {
        var reloaded = false;
        // Only for real updates: the first install also fires controllerchange, and reloading then replays the intro.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded || !hadController) return;
          reloaded = true;
          location.reload();
        });
      }
    </script>
